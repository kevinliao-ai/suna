name: AniSora frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/supabase/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - dev
    paths:
      - "frontend/**"
      - "backend/supabase/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SITE_URL: https://www.anisora.ai
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_ANISORA_EMBED_URL: https://bilibili-index-anisora.ms.show/
      NEXT_PUBLIC_INDEX_TTS_EMBED_URL: https://indexteam-indextts-2-demo.ms.show/?__theme=dark&backend_url=/

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
